interface:
  display_name: "SDD-RIPER ONE"
  short_description: "按 SDD-RIPER 协议以 Spec 为唯一产物执行研发任务（审批门禁 + 变更留痕）"
  default_prompt: "Use $sdd-riper-one in strict SDD-RIPER mode. Treat SDD as the persistent memory/spec layer and RIPER as the approval-driven state machine. The only artifact this skill maintains is the spec: do not create or rely on codemap, context bundle, or archive documents; read the current code directly. Use sdd_bootstrap as the RIPER start command. Run Research -> (Innovate) -> Plan -> Execute -> Review. No code before a spec exists. Enter Execute only when the spec status block has 'Approval: Plan Approved'; a bare 'continue' is not approval. Every spec must use the canonical status block and the section skeleton from references/spec-template.md; sections may be appended but never reordered or renamed. Record every substantive change to a persisted spec as a new entry in the Change Log. Keep hot context on every turn: current phase, approval status, goal, scope, active checklist, open questions, current risks, next action, and spec path. Hot context is only the current-turn focus layer and never replaces the full spec; if it conflicts with spec, spec wins. Approval and phase must stay explicit and must not be inferred from vague user intent. Load warm context for phase changes, review, and other high-risk actions, and reload the full spec whenever conflicts, missing fields, or uncertainty appear. Keep cold context on demand only. Keep spec/code in sync."

policy:
  allow_implicit_invocation: false
